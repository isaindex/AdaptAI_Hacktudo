<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adapt AI — Jornada do Aluno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="page-aluno-mobile">

  <!-- Container Mobile Centralizado e Sem Moldura Falsa -->
  <div class="aluno-mobile-container">

    <!-- Header Mobile -->
    <header class="aluno-header">
      <img src="assets/images/logo-lilas.svg" alt="Adapt IA" class="aluno-header__logo">
      <button type="button" class="aluno-header__btn" aria-label="Notificações">
        <svg width="18" height="20" viewBox="0 0 18 20" fill="none">
          <path d="M5.35179 18.2418C6.19288 19.311 7.51418 20 9 20C10.4858 20 11.8071 19.311 12.6482 18.2418C10.2264 18.57 7.77357 18.57 5.35179 18.2418Z" fill="#8534EC"/>

        </svg>
      </button>
    </header>

    <!-- Saudação do Aluno -->
    <section class="aluno-welcome">
      <div class="aluno-welcome__avatar-wrap">
        <img src="assets/images/icon/avatar.png" alt="Avatar de Mariana" class="aluno-welcome__avatar">
      </div>
      <div class="aluno-welcome__info">
        <h1 class="aluno-welcome__title">Olá Mariana!</h1>
        <p class="aluno-welcome__subtitle">Bem-vindo a sua jornada!</p>
      </div>
    </section>

    <!-- Card "Em progresso:" com Mascote Acenando -->
    <section class="aluno-progresso-bloco">
      <h2 class="aluno-progresso-bloco__label">Em progresso:</h2>
      <div class="aluno-card-wrapper">
        <img src="assets/images/mascote/neutro.svg" alt="Robô Mascote acenando" class="aluno-mascote-banner">
        <div class="aluno-card-progresso">
          <h3 class="aluno-card-progresso__titulo">Desafio - Sistema Respiratório</h3>
          <div class="aluno-card-progresso__meta">
            <span>Nível 4</span>
            <span>320/500</span>
          </div>
          <div class="aluno-card-progresso__bar-bg">
            <div class="aluno-card-progresso__bar-fill" style="width: 64%;"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Trilha de Aprendizagem (Roadmap com Checkpoints) -->
    <section class="aluno-trilha-container">
      <!-- Linha pontilhada conectando os desafios com curva fluida e checkpoints conectados -->
      <svg class="aluno-trilha-svg-line" viewBox="0 0 380 448" fill="none" preserveAspectRatio="none">
        <path d="M 309,37 C 320,75 60,75 71,113 C 60,151 320,151 309,189 C 320,227 60,227 71,265 C 60,323 190,323 190,382" 
              stroke="#D6C6F7" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/>
      </svg>

      <!-- Nó 1: Desafio 01 (Card na esquerda, Checkpoint Roxo na direita) -->
      <div class="aluno-trilha-passo aluno-trilha-passo--right">
        <div class="trilha-card trilha-card--purple">
          <strong>Desafio 01</strong>
          <span>Introdução</span>
        </div>
        <div class="trilha-checkpoint trilha-checkpoint--purple">
          <div class="trilha-checkpoint__inner"></div>
        </div>
      </div>

      <!-- Nó 2: Desafio 02 (Checkpoint Coral na esquerda, Card na direita) -->
      <div class="aluno-trilha-passo aluno-trilha-passo--left">
        <div class="trilha-checkpoint trilha-checkpoint--coral">
          <div class="trilha-checkpoint__inner"></div>
        </div>
        <div class="trilha-card trilha-card--coral">
          <strong>Desafio 02</strong>
          <span>Tratos</span>
        </div>
      </div>

      <!-- Nó 3: Desafio 03 (Card na esquerda, Checkpoint Ciano na direita) -->
      <div class="aluno-trilha-passo aluno-trilha-passo--right">
        <div class="trilha-card trilha-card--cyan">
          <strong>Desafio 03</strong>
          <span>Funções</span>
        </div>
        <div class="trilha-checkpoint trilha-checkpoint--cyan">
          <div class="trilha-checkpoint__inner"></div>
        </div>
      </div>

      <!-- Nó 4: Desafio 04 (Checkpoint Verde na esquerda, Card na direita) -> Ativo / Clicável! -->
      <a href="aluno-desafio.html" class="aluno-trilha-passo aluno-trilha-passo--left" title="Abrir Desafio 04">
        <div class="trilha-checkpoint trilha-checkpoint--green">
          <div class="trilha-checkpoint__inner"></div>
        </div>
        <div class="trilha-card trilha-card--green">
          <strong>Desafio 04</strong>
          <span>Hematose</span>
        </div>
      </a>

      <!-- Nó Final: Desafio Final (Medalha/Coin Dourada) -->
      <div class="aluno-trilha-final">
        <span class="trilha-final__label">Desafio Final</span>
        <img src="assets/images/icon/checkpoint-desafio-final.svg" alt="Checkpoint Desafio Final" class="trilha-final__coin">
      </div>
    </section>

    <!-- Barra de Navegação Inferior Mobile -->
    <nav class="aluno-nav-bottom" aria-label="Navegação inferior">
      <a href="aluno-inicio.html" class="aluno-nav-bottom__item is-active" aria-label="Início">
        <span class="aluno-nav-bottom__icon">

        <span class="aluno-nav-bottom__indicator"></span>

      <!-- Troféu: Meu Desempenho -->
      <a href="aluno-meu-desempenho.html" class="aluno-nav-bottom__item" aria-label="Meu Desempenho">
        <span class="aluno-nav-bottom__icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3.5 2C2.67157 2 2 2.67157 2 3.5V6C2 8.20914 3.79086 10 6 10H6.26C6.88457 11.4116 8.16365 12.4406 9.725 12.6957V15H8C7.44772 15 7 15.4477 7 16V17.5C7 18.0523 7.44772 18.5 8 18.5H12C12.5523 18.5 13 18.0523 13 17.5V16C13 15.4477 12.5523 15 12 15H10.275V12.6957C11.8364 12.4406 13.1154 11.4116 13.74 10H14C16.2091 10 18 8.20914 18 6V3.5C18 2.67157 17.3284 2 16.5 2H3.5ZM3.75 3.75H5.25V8.25C4.42157 8.25 3.75 7.57843 3.75 6.75V3.75ZM14.75 8.25V3.75H16.25V6.75C16.25 7.57843 15.5784 8.25 14.75 8.25ZM7 3.75H13V8C13 9.65685 11.6569 11 10 11C8.34315 11 7 9.65685 7 8V3.75Z" fill="#CFD6DC"/>
