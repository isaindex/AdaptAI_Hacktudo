<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Adapt AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/all.css">
  <link rel="stylesheet" href="assets/css/pages/aluno-atividades.css">
  
</head>
<body class="page-progresso-aluno">

  <header class="header-atividades">
      <h1 class="page-title">Olá, João!</h1>
      <p class="page-subtitle">Aqui estão suas atividades.</p>
  </header>

  <main>
    <section class="materia-destaque">
      <div class="materia-destaque__thumb">
        <img src="assets/images/icon/checkpoint-desafio-final.svg" alt="">
      </div>

      <div class="materia-destaque__info">
        <h2 class="materia-destaque__titulo">Sistema Respiratório</h2>
        <p class="materia-destaque__subtitulo">Biologia · 2º ano</p>

        <div class="materia-destaque__progresso">
          <div class="barra">
            <div class="barra__preenchido" style="width: 80%"></div>
          </div>
          <span class="materia-destaque__valor">80%</span>
        </div>

        <p class="materia-destaque__contador">4 de 5 desafios concluídos</p>
      </div>
    </section>
    <!-- Progresso por conteúdo -->
    <section class="desafios-painel">
      <ul class="desafios-lista">
        <li class="desafio-item">
          <span class="nome-desafio">Desafio 1</span>
          <p class="subtitutlo-desafio">Introdução</p>
        </li>

        <li class="desafio-item">
          <span class="nome-desafio">Desafio 2</span>
          <p class="subtitutlo-desafio">Indentifique os órgãos</p>
        </li>

        <li class="desafio-item">
          <span class="nome-desafio">Desafio 3</span>
          <p class="subtitutlo-desafio">Como funciona?</p>
        </li>
      </ul>
    </section>
  </main>

  <!-- Menu inferior -->
  <nav class="menu-inferior">
    <a href="aluno-meu-desempenho.html">Meu desempenho</a>
    <a href="aluno-atividades-personalizadas.html">Ver atividades personalizadas</a>
  </nav>

  <script src="assets/js/all.js"></script>
</body>
</html>
