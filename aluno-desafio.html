<body class="page-desafio-mobile">

  <!-- Container Mobile Centralizado e Sem Moldura Falsa -->
  <div class="aluno-mobile-container">

    <!-- Header do Desafio -->
    <header class="desafio-header">
      <a href="aluno-inicio.html" class="desafio-header__back" aria-label="Voltar para a Jornada">
        <svg width="10" height="16" viewBox="0 0 8 14" fill="none">
          <path d="M7 1L1 7L7 13" stroke="#8534EC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1 class="desafio-header__title">Desafio 04</h1>
      <div class="desafio-header__avatar">
        <img src="assets/images/icon/avatar.png" alt="Avatar de Mariana">
      </div>
    </header>

    <!-- Barra de Progresso com Traços/Pílulas Segmentadas -->
    <div class="desafio-dashes" aria-label="Progresso do desafio: questão 2 de 14">
      <div class="desafio-dash is-active"></div>
      <div class="desafio-dash is-active"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
      <div class="desafio-dash"></div>
    </div>

    <!-- Card com Ilustração do Sistema Respiratório -->
    <div class="desafio-card-imagem">
      <img src="assets/images/icon/imagem-question.png" alt="Ilustração do Sistema Respiratório destacando traqueia, brônquios e pulmões">
    </div>

    <!-- Pergunta com o Robô Mascote Pensativo -->
    <div class="desafio-pergunta-bloco">
      <h2 class="desafio-pergunta-texto">Qual estrutura é responsável pelas trocas gasosas?</h2>
      <img src="assets/images/mascote/confuso.svg" alt="Mascote pensando" class="desafio-mascote-pensando">
    </div>

    <!-- Lista de Alternativas (A, B, C, D) -->
    <div class="desafio-opcoes" role="radiogroup" aria-label="Opções de resposta">
      <div class="desafio-opcao" data-valor="A" role="radio" aria-checked="false" tabindex="0">
        <div class="desafio-opcao__badge">A</div>
        <span class="desafio-opcao__texto">Traqueia</span>
        <span class="desafio-opcao__status" aria-hidden="true"></span>
      </div>

      <div class="desafio-opcao" data-valor="B" role="radio" aria-checked="false" tabindex="0">
        <div class="desafio-opcao__badge">B</div>
        <span class="desafio-opcao__texto">Brônquios</span>
        <span class="desafio-opcao__status" aria-hidden="true"></span>
      </div>

      <div class="desafio-opcao" data-valor="C" role="radio" aria-checked="false" tabindex="0">
        <div class="desafio-opcao__badge">C</div>
        <span class="desafio-opcao__texto">Diafragma</span>
        <span class="desafio-opcao__status" aria-hidden="true"></span>
      </div>

      <!-- Alternativa D pré-selecionada conforme Tela 2 -->
      <div class="desafio-opcao is-selected" data-valor="D" role="radio" aria-checked="true" tabindex="0">
        <div class="desafio-opcao__badge">D</div>
        <span class="desafio-opcao__texto">Alvéolos</span>
        <span class="desafio-opcao__status" aria-hidden="true"></span>
      </div>
    </div>

    <!-- Botão de Ação: Responder (Tela 2) / Continue (Tela 3) -->
    <div class="desafio-acao-container">
      <button type="button" id="btnDesafioAction" class="btn-desafio-action btn-desafio-action--responder">
        Responder
      </button>
    </div>

    <!-- Feedback Toast -->
    <div id="desafioToast" class="desafio-feedback-toast" role="status" aria-live="polite"></div>

    <!-- Barra de Navegação Inferior Mobile -->
    <nav class="aluno-nav-bottom" aria-label="Navegação inferior">
      <a href="aluno-inicio.html" class="aluno-nav-bottom__item is-active" aria-label="Início">
